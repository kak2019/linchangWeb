services:
  website:
    image: ${WEBSITE_IMAGE:?set WEBSITE_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-3002}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      TEACHER_ECOSYSTEM_SERVICE_TOKEN: ${TEACHER_ECOSYSTEM_SERVICE_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
