name: docker-publish-deploy-development

on:
  push:
    branches:
      - "feature/**"
      - "feature-*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, push, and deploy to the Non-Prod Docker host"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: crpi-tuqzw1uka36vt7nh.cn-hangzhou.personal.cr.aliyuncs.com
  WEBSITE_IMAGE_NAME: acr_namespace_narrativeos/linchangweb-website

concurrency:
  group: linchang-web-development
  cancel-in-progress: true

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feature-') }}
    environment: development
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.vars.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "version_tag=dev-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Validate development public URL
        env:
          WORKBENCH_URL: ${{ vars.WORKBENCH_URL }}
        run: |
          test -n "$WORKBENCH_URL" || { echo "development variable WORKBENCH_URL is required"; exit 1; }
          case "$WORKBENCH_URL" in
            http://*/narrativeos/) ;;
            *) echo "WORKBENCH_URL must look like http://SERVER_IP:3001/narrativeos/"; exit 1 ;;
          esac

      - name: Build and push development website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_WORKBENCH_URL=${{ vars.WORKBENCH_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.WEBSITE_IMAGE_NAME }}:${{ steps.vars.outputs.version_tag }}
          cache-from: type=gha,scope=linchang-web-development
          cache-to: type=gha,mode=max,scope=linchang-web-development

  deploy:
    if: ${{ (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feature-')) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare development deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "${{ secrets.DEPLOY_PATH }}"

      - name: Upload development deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy on Non-Prod host
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          WEBSITE_IMAGE_NAME: ${{ env.WEBSITE_IMAGE_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_TAG,REGISTRY,WEBSITE_IMAGE_NAME,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 60m
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            test -s .env || { echo "Missing development .env in $PWD"; exit 1; }
            echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
            export WEBSITE_IMAGE="$REGISTRY/$WEBSITE_IMAGE_NAME:$VERSION_TAG"
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither 'docker compose' nor 'docker-compose' is installed on the remote host."
              exit 1
            fi
            docker network inspect narrativeos-development >/dev/null 2>&1 || docker network create narrativeos-development
            $COMPOSE_CMD --env-file .env -f docker-compose.dev.yml pull website
            $COMPOSE_CMD --env-file .env -f docker-compose.dev.yml up -d website
