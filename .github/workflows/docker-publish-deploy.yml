name: docker-publish-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, push, and deploy to the remote Docker host"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: crpi-tuqzw1uka36vt7nh.cn-hangzhou.personal.cr.aliyuncs.com
  WEBSITE_IMAGE_NAME: acr_namespace_narrativeos/linchangweb-website
  WORKBENCH_URL: https://www.narrativeos.cn/narrativeos/

# Only the newest production deployment is useful; cancel stale builds/deploys.
concurrency:
  group: linchang-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.vars.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check shared UI release identity
        run: node packages/narrativeos-ui/verify-release.cjs --base-ref HEAD^

      - name: Validate production public URL
        run: node scripts/validate-workbench-url.cjs production

      - name: Compute image tag
        id: vars
        run: echo "version_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEBSITE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.version_tag }}

      - name: Build and push website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          # Alibaba Cloud Personal ACR does not accept Buildx attestation manifests.
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_WORKBENCH_URL=${{ env.WORKBENCH_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linchang-web
          cache-to: type=gha,mode=max,scope=linchang-web

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          WEBSITE_IMAGE_NAME: ${{ env.WEBSITE_IMAGE_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          WEBSITE_PORT: ${{ vars.WEBSITE_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_TAG,REGISTRY,WEBSITE_IMAGE_NAME,ACR_USERNAME,ACR_PASSWORD,WEBSITE_PORT
          command_timeout: 60m
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
            export WEBSITE_IMAGE="$REGISTRY/$WEBSITE_IMAGE_NAME:$VERSION_TAG"
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither 'docker compose' nor 'docker-compose' is installed on the remote host."
              exit 1
            fi
            timed_retry() {
              name="$1"
              shift
              echo "[$(date -Is)] Starting $name"
              for attempt in 1 2 3 4 5; do
                if "$@"; then
                  echo "[$(date -Is)] Finished $name"
                  return 0
                fi
                echo "[$(date -Is)] $name failed, retry $attempt/5..."
                sleep 20
              done
              echo "[$(date -Is)] $name failed after retries"
              return 1
            }
            timed_retry "pull website image" $COMPOSE_CMD -p linchang-web -f docker-compose.prod.yml pull website
            echo "[$(date -Is)] Starting docker compose up"
            $COMPOSE_CMD -p linchang-web -f docker-compose.prod.yml up -d
            echo "[$(date -Is)] Finished docker compose up"
            # Keep cleanup out of the deployment critical path; run it separately
            # during maintenance so a deploy is not delayed by Docker disk scans.
